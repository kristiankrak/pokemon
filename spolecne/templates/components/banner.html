{# Použití: {% include "components/banner.html" %} – lze přepsat přes {% set banner_title=... %} #}
<section class="poke-banner">
    <div class="container">
        <div class="row align-items-center g-4">
            <div class="col-md-7">
                <h1 class="banner-title">{{ banner_title | default("Chytej je všechny!") }}</h1>
                <p class="banner-text">{{ banner_text | default("Prohlédni si Pokédex, poznej typy a najdi svého parťáka.") }}</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-poke btn-lg">Otevřít Pokédex</a>
            </div>
            <div class="col-md-5 text-center">
                <img class="banner-img"
                     src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
                     alt="Pikachu">
            </div>
        </div>
    </div>
</section>
